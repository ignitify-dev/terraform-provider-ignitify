# Release build, from the official Terraform provider template.
# Changes to the template: a draft release, no `go mod tidy` before the build (a release builds
# the committed go.mod and go.sum), and each zip carries the licence and the
# third-party notices.
version: 2
builds:
  - env:
      # No cgo: a static binary runs in any CI system without extra libraries.
      - CGO_ENABLED=0
    mod_timestamp: '{{ .CommitTimestamp }}'
    flags:
      - -trimpath
    ldflags:
      - '-s -w -X main.version={{.Version}}'
    goos:
      - freebsd
      - windows
      - linux
      - darwin
    goarch:
      - amd64
      - '386'
      - arm
      - arm64
      - s390x
    ignore:
      - goos: darwin
        goarch: '386'
      - goos: darwin
        goarch: s390x
      - goos: freebsd
        goarch: s390x
      - goos: windows
        goarch: arm
      - goos: windows
        goarch: s390x
    binary: '{{ .ProjectName }}_v{{ .Version }}'
archives:
  - formats:
      - zip
    name_template: '{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}'
    files:
      - LICENSE
      - THIRD_PARTY_NOTICES
checksum:
  extra_files:
    - glob: 'terraform-registry-manifest.json'
      name_template: '{{ .ProjectName }}_{{ .Version }}_manifest.json'
  name_template: '{{ .ProjectName }}_{{ .Version }}_SHA256SUMS'
  algorithm: sha256
signs:
  # A binary (not armored) detached signature of the SHA256SUMS file, made with
  # the company's RSA release key. The CI step imports the key from the CI
  # secret store and passes its fingerprint.
  - artifacts: checksum
    args:
      - '--batch'
      - '--local-user'
      - '{{ .Env.GPG_FINGERPRINT }}'
      - '--output'
      - '${signature}'
      - '--detach-sign'
      - '${artifact}'
release:
  extra_files:
    - glob: 'terraform-registry-manifest.json'
      name_template: '{{ .ProjectName }}_{{ .Version }}_manifest.json'
  # The release stays a draft until a maintainer checks it and publishes it.
  draft: true
changelog:
  disable: true
